# GitHub Pages deployment for the SCG site.
#
# ┌──────────────────────────────────────────────────────────────────────────────────────────┐
# │ LAUNCH SWITCH: SITE_MODE (below, under jobs → build → env)                               │
# │   preview     https://dleo04.github.io/scg-website/  (sub-folder, noindex) ← DEFAULT     │
# │   production  https://sniderconsultinggroup.com/     (domain root, indexable, CNAME)     │
# │ Every setting of a mode lives in scripts/site-mode.mjs. Change only SITE_MODE here.      │
# │ Flip it to production ONLY on launch day, following docs/LAUNCH.md step by step.        │
# └──────────────────────────────────────────────────────────────────────────────────────────┘
#
# Runs on every push to main (and by hand from the Actions tab).
#
# One-time setup on github.com: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # LAUNCH SWITCH: "preview" (default) or "production". See the box at the top and
      # docs/LAUNCH.md. Nothing else in this file changes between the two modes.
      SITE_MODE: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # current Node LTS, the version this project is developed on
          cache: npm

      - run: npm ci

      # Full build (images, Eleventy, privacy check, check:notes, redirects check, contrast
      # check) with the settings of SITE_MODE; production also writes _site/CNAME.
      - run: node scripts/site-mode.mjs "$SITE_MODE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

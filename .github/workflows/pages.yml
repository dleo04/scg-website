# GitHub Pages PREVIEW deployment: https://dleo04.github.io/scg-website/
#
# Runs on every push to main (and by hand from the Actions tab). It builds the site under the
# /scg-website/ path prefix and publishes it to GitHub Pages. This is a preview only: it is
# not the production site, it is hidden from search engines, and it does not change how the
# production build for sniderconsultinggroup.com works (that build sets none of the variables
# below and is served from the domain root).
#
# One-time setup on github.com: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PREVIEW-ONLY settings (never set these for the production build):
      PATH_PREFIX: /scg-website/                       # every internal URL gets this prefix
      SITE_URL: https://dleo04.github.io/scg-website   # canonical, Open Graph, JSON-LD, sitemap URLs
      PREVIEW_NOINDEX: "1"                             # robots noindex meta on every page + Disallow robots.txt
      # PREVIEW-ONLY escape hatch for check:notes (dev notes such as [TBD] / TODO left in pages).
      # Keep "0": the build then fails on any note, exactly like production. Setting "1" lets a
      # preview deploy while still printing every note as a warning in the log; never use it
      # for production (SCG_ENV=production ignores it).
      SKIP_CHECK_NOTES: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # current Node LTS, the version this project is developed on
          cache: npm

      - run: npm ci

      # Same build as production (images, Eleventy, privacy check, check:notes, contrast check),
      # with the preview settings above.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
